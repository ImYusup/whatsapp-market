name: Market Notification Cron

on:
  schedule:
    # Setiap 15 menit
    - cron: "0,15,30,45 * * * *"     # XAU
    - cron: "2,17,32,47 * * * *"     # BTC (selisih 2 menit biar tidak bentrok)

  workflow_dispatch:  # biar bisa trigger manual dari GitHub

jobs:
  # ==================== XAU ====================
  xau-market-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Check CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ GitHub CRON_SECRET KOSONG"
            exit 1
          fi
          echo "✅ CRON_SECRET tersedia"

      - name: Trigger XAU/USD
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://whatsapp-market.vercel.app/api/cron/market/xau"

  # ==================== BTC (Crypto) ====================
  btc-market-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Check CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ GitHub CRON_SECRET KOSONG"
            exit 1
          fi
          echo "✅ CRON_SECRET tersedia"

      - name: Trigger BTC/Crypto
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -f -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://whatsapp-market.vercel.app/api/cron/market/btc"