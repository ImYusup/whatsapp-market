name: Market Notification Cron

on:
  schedule:
    # Setiap 15 menit (UTC)
    - cron: "0,15,30,45 * * * *"   # XAU
    - cron: "2,17,32,47 * * * *"   # BTC

  workflow_dispatch:

jobs:
  xau-market-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Check CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET KOSONG"
            exit 1
          fi
          echo "✅ CRON_SECRET tersedia (length: ${#CRON_SECRET})"

      - name: Trigger XAU/USD
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering XAU..."
          HTTP_CODE=$(curl -s -o /tmp/xau_response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://whatsapp-market.vercel.app/api/cron/market/xau")

          echo "HTTP Status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/xau_response.json
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ XAU failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ XAU success"

  btc-market-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Check CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "❌ CRON_SECRET KOSONG"
            exit 1
          fi
          echo "✅ CRON_SECRET tersedia (length: ${#CRON_SECRET})"

      - name: Trigger BTC/Crypto
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering BTC/Crypto..."
          HTTP_CODE=$(curl -s -o /tmp/btc_response.json -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://whatsapp-market.vercel.app/api/cron/market/btc")

          echo "HTTP Status: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/btc_response.json
          echo ""

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ BTC failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ BTC success"